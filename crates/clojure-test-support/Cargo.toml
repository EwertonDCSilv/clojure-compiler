[package]
name = "clojure-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "clojure_test_support"
path = "src/lib.rs"

[[bin]]
name = "clojure-conformance"
path = "src/main.rs"
test = false

[dependencies]
clojure-reader.workspace = true
clojure-span.workspace = true
clojure-syntax.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = { version = "3", default-features = false }
toml = "0.8"
wait-timeout = "0.2"

[lints.rust]
unsafe_code = "forbid"

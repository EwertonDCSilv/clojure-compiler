schema_version = 1
clojure_version = "1.12.5"
reference = "https://clojure.org/reference/reader"

# Each capability contributes normal, boundary, and error scenarios to the
# denominator. Empty arrays are tracked gaps. A scenario is excluded only when
# `not_applicable` records why the official grammar has no equivalent case.

[[capability]]
id = "literal.boolean-nil"
category = "literals"
syntax = "nil true false"
source = "Clojure Reader reference: literals"
behavior = "Reads nil and the two Boolean literals as dedicated values."
issue = 9
dependencies = []
decision = "Other spellings are symbols, so an invalid-token error is not applicable."
normal = ["a.literals.booleans_nil"]
boundary = ["a.literals.booleans_nil"]
error = []
not_applicable = ["error"]


# PROTÓTIPO DESCARTÁVEL — NÃO É CÓDIGO DE PRODUÇÃO.
# Pergunta arquitetural (specs/IMPLEMENTATION_PLAN.md Fase 0.3 #1 / ADR-0001):
# "Conseguimos emitir um objeto com Cranelift e linká-lo em um executável nativo
#  autônomo que roda sem JVM?"
[package]
name = "p01-cranelift-exe"
version = "0.0.0"
edition = "2021"
publish = false

# Isola do workspace principal.
[workspace]

[dependencies]
cranelift-codegen = "0.124"
cranelift-frontend = "0.124"
cranelift-module = "0.124"
cranelift-object = "0.124"
target-lexicon = "0.13"

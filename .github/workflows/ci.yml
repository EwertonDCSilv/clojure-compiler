name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Lint maintained Clojure sources
        run: scripts/lint-clojure.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  coverage:
    name: Coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: scripts/coverage.sh

  benchmarks:
    name: Algorithm benchmark checksums
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p clojure-native-cli
      - run: benchmarks/cracking/run.sh --chapter 01
      - run: benchmarks/cormen/run.sh

  conformance:
    name: Clojure A-E conformance
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native compiler and conformance runner
        run: cargo build --release --locked -p clojure-native-cli -p clojure-test-support
      - name: Verify offline without a JVM
        run: scripts/conformance.sh verify

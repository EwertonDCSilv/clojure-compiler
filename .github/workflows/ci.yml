name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make quality

  coverage:
    name: Coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: make coverage

  benchmarks:
    name: Algorithm benchmark checksums
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: make benchmarks-ci

  conformance:
    name: Clojure A-E conformance
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify offline without a JVM
        run: make compatibility

  security:
    name: Runtime sanitizers and HTTP hardening
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Runtime C harnesses under ASan/UBSan
        run: make test-runtime-sanitize
      - name: HTTP server 1000-cycle start/serve/stop gate
        env:
          CLJN_HTTP_CYCLES: "1000"
        run: cargo test --release -p clojure-native-cli --test e2e http_server_subprocess_start_serve_stop_cycles
      - name: HTTP request parser fuzz smoke
        run: make fuzz-http FUZZ_SECONDS=60
